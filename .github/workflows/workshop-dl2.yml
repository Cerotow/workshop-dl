name: workshop-dl2

on:
  workflow_dispatch:

jobs:
  setup-and-download-entry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install SteamCMD
        run: |
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note "" | sudo debconf-set-selections
          sudo apt update
          sudo apt install -y steamcmd

      - name: Set input variables
        run: |
          # Make sure input.sh is executable
          chmod +x ./input.sh
          # Load variables from input.sh
          source ./input.sh
          # Export for next steps
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "ENTRY_ID=$ENTRY_ID" >> $GITHUB_ENV
        shell: bash

      - name: Download Workshop item
        run: |
          mkdir -p ./downloaded
          echo "Downloading $ENTRY_ID for app $APP_ID..."
          steamcmd +login anonymous +workshop_download_item $APP_ID $ENTRY_ID validate +quit
        shell: bash

      - name: Move downloaded files
        run: |
          WORKSHOP_PATH=~/.steam/steam/steamapps/workshop/content/$APP_ID/$ENTRY_ID
          if [ -d "$WORKSHOP_PATH" ]; then
            cp -r "$WORKSHOP_PATH"/* ./downloaded/
            echo "Files copied to ./downloaded/"
          else
            echo "No files found at $WORKSHOP_PATH"
          fi
          ls -lar ./downloaded/
        shell: bash

      - name: Commit downloaded files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./downloaded/*
          git commit -m "Add downloaded workshop item $ENTRY_ID" || echo "No changes to commit"
          git push
        shell: bash 
